<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Timer Widget Free</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Oswald:wght@700&display=swap" rel="stylesheet">

  <style>
    /* RESTRICTED SINGLE COLOR VARIABLES FROM KITCHEN TIMER */
    :root {
      --page-bg: transparent;
      --block-bg: #252423;
      --block-border: #333333;
      --text-main: #FFFFFF;
      --text-muted: rgba(255, 255, 255, 0.4);
      --accent: #FFFFFF;
      --accent-text: #252423;
      --font-ui: 'Inter', -apple-system, sans-serif;
      --font-display: 'Oswald', sans-serif;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%;
      background-color: var(--page-bg); display: flex; justify-content: center;
      align-items: center; font-family: var(--font-ui); -webkit-font-smoothing: antialiased;
      transition: background-color 0.3s ease;
    }

    .widget-block {
      background-color: var(--block-bg); border: 1px solid var(--block-border);
      border-radius: 24px; padding: 24px; display: flex; flex-direction: column;
      width: 320px; min-height: 460px; box-shadow: 0 4px 20px rgba(0,0,0,0.2);
      position: relative; overflow: hidden;
    }

    /* HEADER */
    .header {
      font-size: 16px; font-weight: 800; color: var(--text-main);
      display: flex; align-items: center; justify-content: space-between; width: 100%;
    }
    .header-controls { display: flex; gap: 8px; }

    .icon-btn-sm {
      background: rgba(255,255,255,0.06); border: none; color: var(--text-muted);
      width: 30px; height: 30px; border-radius: 50%; display: flex;
      align-items: center; justify-content: center; cursor: pointer;
      transition: all 0.25s cubic-bezier(0.25, 1, 0.5, 1); flex-shrink: 0;
      text-decoration: none;
    }
    .icon-btn-sm:hover { background: rgba(255,255,255,0.12); color: var(--text-main); }
    .icon-btn-sm:active { transform: scale(0.9); }
    .icon-btn-sm svg { width: 15px; height: 15px; fill: currentColor; }

    .btn-icon-back {
      background: rgba(255,255,255,0.06); border: none; color: var(--text-main);
      width: 32px; height: 32px; border-radius: 50%; display: flex;
      align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0;
      transition: all 0.25s cubic-bezier(0.25, 1, 0.5, 1);
    }
    .btn-icon-back:hover { background: rgba(255,255,255,0.12); }
    .btn-icon-back:active { transform: scale(0.9); }
    .btn-icon-back svg { width: 14px; height: 14px; fill: currentColor; }

    /* VIEWS */
    #setup-view, #running-view, #presets-view {
      display: flex; flex-direction: column; height: 100%; flex: 1;
      animation: fadeUp 0.35s cubic-bezier(0.25, 1, 0.5, 1) forwards;
    }
    #setup-view, #running-view { gap: 18px; }
    #presets-view { gap: 12px; }
    #running-view, #presets-view { display: none; }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

    /* SETUP TIME DISPLAY */
    .time-display-setup {
      display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 0 4px 0;
    }
    .time-big {
      font-family: var(--font-display); font-size: 56px; font-weight: 700;
      color: var(--text-main); font-variant-numeric: tabular-nums; letter-spacing: 1px;
    }
    .time-label {
      font-size: 11px; color: var(--text-muted); font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px;
    }

    /* STEPPER */
    .stepper-row { display: flex; align-items: center; justify-content: center; gap: 8px; }
    .stepper-btn {
      background: rgba(255,255,255,0.06); border: none; color: var(--text-main);
      padding: 9px 14px; border-radius: 12px; font-family: var(--font-ui);
      font-size: 12px; font-weight: 700; cursor: pointer; transition: all 0.2s cubic-bezier(0.25, 1, 0.5, 1);
    }
    .stepper-btn:hover { background: rgba(255,255,255,0.12); }
    .stepper-btn:active { transform: scale(0.92); }
    .stepper-divider { width: 1px; height: 18px; background: var(--block-border); }

    /* PRESET CHIPS */
    .presets-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
    .preset-chip {
      background: rgba(255,255,255,0.06); border: none; color: var(--text-muted);
      padding: 10px 0; border-radius: 12px; font-family: var(--font-ui);
      font-size: 12px; font-weight: 700; cursor: pointer; text-align: center;
      transition: all 0.25s cubic-bezier(0.25, 1, 0.5, 1); overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
    }
    .preset-chip:hover { background: rgba(255,255,255,0.12); color: var(--text-main); }
    .preset-chip.active { background: var(--accent); color: var(--accent-text); }
    .preset-chip:active { transform: scale(0.94); }

    .quick-add-wrap { display: flex; justify-content: center; gap: 8px; }
    .quick-add-wrap .preset-chip { padding: 9px 16px; width: auto; min-width: 60px; }
    
    /* LOCKED PRESETS (FREE VIEW) */
    .locked-presets-container {
      position: relative; display: flex; flex-direction: column; flex: 1; text-decoration: none;
      border-radius: 12px; overflow: hidden; margin-top: 4px;
    }
    .locked-blur {
      display: flex; flex-direction: column; gap: 6px; width: 100%; transition: filter 0.3s ease;
    }
    .preset-list-item {
      background: rgba(255,255,255,0.06); border: none; color: var(--text-main);
      padding: 12px 16px; border-radius: 12px; font-family: var(--font-ui);
      font-size: 13px; font-weight: 600; display: flex; justify-content: space-between; align-items: center;
    }
    .preset-list-item .p-title { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; max-width: 65%; text-align: left; }
    .preset-list-item .p-time { color: var(--text-muted); font-size: 12px; font-variant-numeric: tabular-nums; font-weight: 700; }
    
    .locked-overlay {
      position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
      background: color-mix(in srgb, var(--block-bg) 60%, transparent); backdrop-filter: blur(3px);
      color: var(--text-main); font-size: 14px; font-weight: 700; opacity: 0; transition: opacity 0.3s ease;
    }
    .locked-overlay svg { width: 24px; height: 24px; fill: currentColor; }
    .locked-presets-container:hover .locked-blur { filter: blur(4px); }
    .locked-presets-container:hover .locked-overlay { opacity: 1; }

    /* PRIMARY START BUTTON */
    .calc-btn {
      margin-top: auto; background: var(--accent); color: var(--accent-text);
      border: none; padding: 14px; border-radius: 16px; font-size: 14px; font-weight: 700;
      cursor: pointer; transition: transform 0.15s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.2s ease;
      font-family: var(--font-ui);
    }
    .calc-btn:active { transform: scale(0.96); }
    .calc-btn:hover { opacity: 0.92; }

    /* RING */
    .ring-wrap {
      position: relative; width: 200px; height: 200px; margin: 4px auto;
      display: flex; align-items: center; justify-content: center; transition: transform 0.3s ease;
    }
    .ring-svg { width: 100%; height: 100%; transform: rotate(-90deg); }
    .ring-track { fill: none; stroke: rgba(255,255,255,0.08); stroke-width: 10; }
    .ring-progress {
      fill: none; stroke: var(--text-main); stroke-width: 10; stroke-linecap: round;
      transition: stroke-dashoffset 0.12s linear, stroke 0.3s ease, filter 0.3s ease;
    }
    .ring-center {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      display: flex; flex-direction: column; align-items: center; gap: 2px;
    }
    .ring-time {
      font-family: var(--font-display); font-size: 42px; font-weight: 700;
      color: var(--text-main); font-variant-numeric: tabular-nums; letter-spacing: 1px;
    }
    .ring-sub { font-size: 11px; color: var(--text-muted); font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }

    @keyframes ringPulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.045); } }
    .ring-wrap.alarming { animation: ringPulse 1s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
    .ring-wrap.alarming .ring-progress { filter: drop-shadow(0 0 14px rgba(255,255,255,0.65)); }

    @keyframes textFlash { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
    .ring-sub.flash { animation: textFlash 1s ease-in-out infinite; }

    /* CONTROLS */
    .controls { display: flex; align-items: center; gap: 12px; width: 100%; justify-content: center; margin-top: auto; }
    .btn-main {
      background: var(--accent); color: var(--accent-text); border: none; padding: 14px 30px;
      border-radius: 16px; font-size: 14px; font-weight: 700; cursor: pointer;
      font-family: var(--font-ui); transition: transform 0.15s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.2s ease;
      flex-grow: 1; max-width: 180px;
    }
    .btn-main:active { transform: scale(0.95); }
    .btn-main:hover { opacity: 0.92; }

    .btn-icon {
      background: rgba(255,255,255,0.06); border: 1px solid var(--block-border); color: var(--text-main);
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1); padding: 13px; border-radius: 50%; flex-shrink: 0;
    }
    .btn-icon:hover { background: var(--text-main); color: var(--accent-text); transform: rotate(-45deg); }
    .btn-icon:active { transform: scale(0.9) rotate(-45deg); }
    .btn-icon svg { width: 18px; height: 18px; fill: currentColor; }
    .alarm-btn { width: 100%; margin-top: 0; }
  </style>
</head>
<body>

  <div class="widget-block">
    <!-- SETUP VIEW -->
    <div id="setup-view">
      <div class="header">
        Timer
        <div class="header-controls">
          <button class="icon-btn-sm" onclick="goToPresets()" aria-label="Saved Presets">
            <svg viewBox="0 0 24 24"><path d="M17 3H7c-1.1 0-2 .9-2 2v16l7-3 7 3V5c0-1.1-.9-2-2-2zm0 15l-5-2.18L7 18V5h10v13z"/></svg>
          </button>
          <button class="icon-btn-sm" id="btn-mute-setup" onclick="toggleMute()" aria-label="Toggle sound">
            <svg viewBox="0 0 24 24" id="icon-mute-setup"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-.77-3.29-2-4.24v8.48c1.23-.95 2-2.47 2-4.24zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
          </button>
        </div>
      </div>

      <div class="time-display-setup">
        <div class="time-big" id="setup-time">05:00</div>
        <div class="time-label">Set Time</div>
      </div>

      <div class="stepper-row">
        <button class="stepper-btn" onclick="adjustSetupTime(-60)">−1m</button>
        <button class="stepper-btn" onclick="adjustSetupTime(-10)">−10s</button>
        <div class="stepper-divider"></div>
        <button class="stepper-btn" onclick="adjustSetupTime(10)">+10s</button>
        <button class="stepper-btn" onclick="adjustSetupTime(60)">+1m</button>
      </div>

      <div class="presets-grid">
        <button class="preset-chip active" data-secs="30" onclick="setPreset(30)">30s</button>
        <button class="preset-chip" data-secs="60" onclick="setPreset(60)">1m</button>
        <button class="preset-chip" data-secs="180" onclick="setPreset(180)">3m</button>
        <button class="preset-chip" data-secs="300" onclick="setPreset(300)">5m</button>
        <button class="preset-chip" data-secs="600" onclick="setPreset(600)">10m</button>
        <button class="preset-chip" data-secs="900" onclick="setPreset(900)">15m</button>
        <button class="preset-chip" data-secs="1200" onclick="setPreset(1200)">20m</button>
        <button class="preset-chip" data-secs="1800" onclick="setPreset(1800)">30m</button>
      </div>

      <button class="calc-btn" onclick="startTimer()">Start Timer</button>
    </div>

    <!-- PRESETS VIEW (PAYWALLED) -->
    <div id="presets-view">
      <div class="header">
        <button class="btn-icon-back" onclick="goToSetup()" aria-label="Back">
          <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
        </button>
        <span>Saved Presets</span>
        <div style="width: 32px;"></div>
      </div>
      
      <a href="https://joecruose.gumroad.com/l/timer_widget" target="_blank" class="locked-presets-container">
         <div class="locked-blur">
           <div class="preset-list-item"><span class="p-title">Reading Session</span><span class="p-time">30:00</span></div>
           <div class="preset-list-item"><span class="p-title">Quick Nap</span><span class="p-time">15:00</span></div>
           <div class="preset-list-item"><span class="p-title">Deep Work</span><span class="p-time">60:00</span></div>
         </div>
         <div class="locked-overlay">
            <svg viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
            <span>Unlock Custom Presets</span>
         </div>
      </a>
    </div>

    <!-- RUNNING VIEW -->
    <div id="running-view">
      <div class="header">
        <button class="btn-icon-back" onclick="goToSetup()" aria-label="Back">
          <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
        </button>
        <span id="running-title">Timer Active</span>
        <button class="icon-btn-sm" onclick="toggleMute()" aria-label="Toggle sound">
          <svg viewBox="0 0 24 24" id="icon-mute-running"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-.77-3.29-2-4.24v8.48c1.23-.95 2-2.47 2-4.24zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
        </button>
      </div>

      <div class="ring-wrap" id="ring-wrap">
        <svg class="ring-svg" viewBox="0 0 200 200">
          <circle class="ring-track" cx="100" cy="100" r="90"></circle>
          <circle class="ring-progress" id="ring-progress" cx="100" cy="100" r="90"></circle>
        </svg>
        <div class="ring-center">
          <div class="ring-time" id="running-time">05:00</div>
          <div class="ring-sub" id="running-sub">remaining</div>
        </div>
      </div>

      <div class="quick-add-wrap">
        <button class="preset-chip" onclick="addQuickTime(-60)">−1m</button>
        <button class="preset-chip" onclick="addQuickTime(30)">+30s</button>
        <button class="preset-chip" onclick="addQuickTime(60)">+1m</button>
      </div>

      <div class="controls" id="controls-active">
        <button class="btn-main" id="btn-pause" onclick="pauseResume()">Pause</button>
        <button class="btn-icon" onclick="resetRunning()" aria-label="Reset Timer">
          <svg viewBox="0 0 24 24"><path d="M12 4V1L8 5l4 4V6c3.31 0 6 2.69 6 6 0 1.01-.25 1.97-.7 2.8l1.46 1.46A7.93 7.93 0 0020 12c0-4.42-3.58-8-8-8zm0 14c-3.31 0-6-2.69-6-6 0-1.01.25-1.97.7-2.8L5.24 7.74A7.93 7.93 0 004 12c0 4.42 3.58 8 8 8v3l4-4-4-4v3z"></path></svg>
        </button>
      </div>

      <div class="controls" id="controls-alarm" style="display: none;">
        <button class="calc-btn alarm-btn" onclick="dismissAlarm()">Dismiss Alarm</button>
      </div>
    </div>
  </div>

  <script>
    /* --- 1. STATE & DOM --- */
    let totalSeconds = 300;
    let remainingSeconds = 300;
    let isRunning = false; let isPaused = false; let isAlarming = false; let isMuted = false;
    let rafId = null; let startTimestamp = 0; let elapsedAtPause = 0; let alarmIntervalId = null;
    const CIRCUMFERENCE = 2 * Math.PI * 90;

    const setupView = document.getElementById('setup-view'); 
    const runningView = document.getElementById('running-view');
    const presetsView = document.getElementById('presets-view');
    const setupTimeEl = document.getElementById('setup-time'); 
    const runningTimeEl = document.getElementById('running-time');
    const runningSubEl = document.getElementById('running-sub'); 
    const runningTitleEl = document.getElementById('running-title');
    const ringWrap = document.getElementById('ring-wrap'); 
    const ringProgress = document.getElementById('ring-progress');
    const btnPause = document.getElementById('btn-pause'); 
    const controlsActive = document.getElementById('controls-active');
    const controlsAlarm = document.getElementById('controls-alarm'); 
    ringProgress.style.strokeDasharray = CIRCUMFERENCE;

    /* --- 2. HELPERS & ACTIONS --- */
    function formatTime(totalSecs) {
      const s = Math.max(0, Math.round(totalSecs));
      return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
    }
    function clampSetupTime(v) { return Math.min(5999, Math.max(5, v)); }
    
    function updateSetupDisplay() {
      setupTimeEl.textContent = formatTime(totalSeconds);
      document.querySelectorAll('#setup-view .preset-chip[data-secs]').forEach(chip => {
        chip.classList.toggle('active', parseInt(chip.dataset.secs) === totalSeconds);
      });
    }

    function updateRing(remaining) {
      const fraction = Math.max(0, Math.min(1, remaining / totalSeconds));
      ringProgress.style.strokeDashoffset = CIRCUMFERENCE * (1 - fraction);
      runningTimeEl.textContent = formatTime(remaining);
    }

    function adjustSetupTime(delta) { totalSeconds = clampSetupTime(totalSeconds + delta); updateSetupDisplay(); }
    function setPreset(seconds) { totalSeconds = seconds; updateSetupDisplay(); }

    /* --- 3. ENGINE & VIEWS --- */
    function switchView(hideViews, showView) {
      hideViews.forEach(v => v.style.display = 'none');
      showView.style.display = 'flex';
      showView.style.animation = 'none'; void showView.offsetWidth; showView.style.animation = '';
    }

    function goToPresets() { switchView([setupView, runningView], presetsView); }
    function goToSetup() {
      stopLoop(); stopAlarm();
      isRunning = false; isPaused = false; isAlarming = false;
      switchView([runningView, presetsView], setupView);
      updateSetupDisplay();
    }

    function startTimer() {
      remainingSeconds = totalSeconds; elapsedAtPause = 0;
      isRunning = true; isPaused = false; isAlarming = false;
      runningTitleEl.textContent = 'Timer Active'; runningSubEl.textContent = 'remaining';
      runningSubEl.classList.remove('flash'); ringWrap.classList.remove('alarming');
      controlsActive.style.display = 'flex'; controlsAlarm.style.display = 'none';
      btnPause.textContent = 'Pause'; updateRing(remainingSeconds);
      switchView([setupView, presetsView], runningView);
      startTimestamp = performance.now(); runLoop();
    }

    function runLoop() {
      rafId = requestAnimationFrame(function loop(now) {
        if (!isRunning || isPaused) return;
        const elapsedSec = elapsedAtPause + (now - startTimestamp) / 1000;
        const remaining = totalSeconds - elapsedSec;
        if (remaining <= 0) { updateRing(0); triggerFinish(); return; }
        remainingSeconds = remaining; updateRing(remaining); rafId = requestAnimationFrame(loop);
      });
    }
    function stopLoop() { if (rafId) cancelAnimationFrame(rafId); rafId = null; }

    function pauseResume() {
      if (!isRunning || isAlarming) return;
      if (!isPaused) {
        isPaused = true; elapsedAtPause += (performance.now() - startTimestamp) / 1000;
        stopLoop(); btnPause.textContent = 'Resume';
      } else {
        isPaused = false; startTimestamp = performance.now();
        btnPause.textContent = 'Pause'; runLoop();
      }
    }

    function resetRunning() {
      stopLoop(); stopAlarm();
      isRunning = true; isPaused = true; isAlarming = false;
      elapsedAtPause = 0; remainingSeconds = totalSeconds;
      runningTitleEl.textContent = 'Timer Active'; runningSubEl.textContent = 'remaining';
      runningSubEl.classList.remove('flash'); ringWrap.classList.remove('alarming');
      controlsActive.style.display = 'flex'; controlsAlarm.style.display = 'none';
      btnPause.textContent = 'Start'; updateRing(remainingSeconds);
      btnPause.onclick = function () {
        btnPause.onclick = pauseResume; isPaused = false; startTimestamp = performance.now();
        btnPause.textContent = 'Pause'; runLoop();
      };
    }

    function addQuickTime(seconds) { 
      if (!isRunning || isAlarming) return; 
      totalSeconds += seconds; 
      if (isPaused) {
        remainingSeconds = totalSeconds - elapsedAtPause;
        if (remainingSeconds <= 0) {
          updateRing(0);
          triggerFinish();
        } else {
          updateRing(remainingSeconds);
        }
      }
    }

    /* --- 4. AUDIO & ALARM --- */
    function triggerFinish() {
      isRunning = false; isAlarming = true;
      runningTitleEl.textContent = "Time's Up!"; runningSubEl.textContent = "Time's Up!";
      runningSubEl.classList.add('flash'); ringWrap.classList.add('alarming');
      controlsActive.style.display = 'none'; controlsAlarm.style.display = 'flex';
      if (navigator.vibrate) navigator.vibrate([200, 100, 200, 100, 200]);
      playAlarmBeep(); alarmIntervalId = setInterval(() => {
        playAlarmBeep(); if (navigator.vibrate) navigator.vibrate(150);
      }, 1300);
    }
    function stopAlarm() { if (alarmIntervalId) clearInterval(alarmIntervalId); alarmIntervalId = null; }
    function dismissAlarm() { goToSetup(); }

    function toggleMute() {
      isMuted = !isMuted;
      const iconOn = '<path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-.77-3.29-2-4.24v8.48c1.23-.95 2-2.47 2-4.24zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>';
      const iconOff = '<path d="M16.5 12A4.5 4.5 0 0014 7.97v2.21l2.45 2.45c.03-.2.05-.42.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.8L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/>';
      document.getElementById('icon-mute-setup').innerHTML = isMuted ? iconOff : iconOn;
      document.getElementById('icon-mute-running').innerHTML = isMuted ? iconOff : iconOn;
    }

    const AudioContext = window.AudioContext || window.webkitAudioContext;
    let sfxCtx;
    function initSFX() {
      if (!sfxCtx) sfxCtx = new AudioContext();
      if (sfxCtx.state === 'suspended') sfxCtx.resume();
    }

    function playAlarmBeep() {
      if (isMuted) return; initSFX();
      const now = sfxCtx.currentTime;
      for (let i = 0; i < 3; i++) {
        const t = now + i * 0.18;
        const osc = sfxCtx.createOscillator(); const gain = sfxCtx.createGain();
        osc.connect(gain); gain.connect(sfxCtx.destination);
        osc.type = 'square'; osc.frequency.setValueAtTime(1000, t);
        gain.gain.setValueAtTime(0.0001, t); gain.gain.exponentialRampToValueAtTime(0.22, t + 0.01);
        gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.13);
        osc.start(t); osc.stop(t + 0.14);
      }
    }

    /* --- BOOT --- */
    updateSetupDisplay();
  </script>
